# claude-man per-project status bar (issue #37 — docs/DEVENV.md "Status bar").
#
# Loaded ONLY by the baked `claude-man-bar` launcher (`tmux -f`), so an operator's own tmux use in the
# container is untouched. Draws the project identity INSIDE the terminal's cell grid — a one-row bar
# pinned to the TOP — where every emulator shows it, unlike the window title / OSC-11 tint that a
# decoration-less tiling desktop (Hyprland/Omarchy) never displays. The three CLAUDE_MAN_BAR_* values
# are rendered host-side (statusbar.py, `##`-escaped) and passed as exec-time env; they expand here
# once at server start, and `claude-man-bar` re-applies them on every attach so a re-attached window
# shows the current registry state. Read-only on the rootfs; tmux's only write is its socket on the
# /tmp tmpfs — the hardened floor is byte-identical (invariant 2).

# --- the bar --------------------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 15
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 100
# One window per session: hide the window list entirely (the bar is identity, not tabs).
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
set -g status-style "$CLAUDE_MAN_BAR_STYLE"
set -g status-left "$CLAUDE_MAN_BAR_LEFT"
set -g status-right "$CLAUDE_MAN_BAR_RIGHT"
# The outer window title stays the launcher's `claude:<slug>` (terminals.window_title) — tmux owns the
# title while attached, so re-assert the same string rather than let a pane clobber it.
set -g set-titles on
set -g set-titles-string "claude:$CLAUDE_MAN_PROJECT"

# --- terminal plumbing for claude (Ink) + the curated shell ----------------------------------------
set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s escape-time 0
set -g focus-events on
set -g extended-keys on          # shift+enter / modified keys reach claude (CSI u)
set -g allow-passthrough on      # OSC/DCS passthrough for apps that need the outer terminal
set -g set-clipboard on
set -g mouse on                  # wheel = scrollback; hold Shift to select in the outer terminal
set -g history-limit 50000
set -g detach-on-destroy on

# --- keyboard scrollback ------------------------------------------------------------------------
# tmux keeps the pane's history ITSELF and draws the pane on the emulator's alternate screen, so the
# terminal's own Shift+PgUp scrolls an empty outer buffer once the bar is on. Reproduce it in tmux:
# Shift+PgUp enters copy mode one page up (root table, no prefix), Shift+PgUp/PgDn keep paging inside
# copy mode, and `-e` exits back to the live pane when paging past the bottom — no `q` needed. Alt+PgUp
# is the same for emulators that consume Shift+PgUp themselves instead of forwarding it (ghostty binds
# shift+page_up=scroll_page_up unconditionally — even on the alternate screen, where it does nothing).
# Plain PgUp/PgDn stay the pane's (claude, nvim, less). Both key tables: mode-keys follows $EDITOR.
bind -n S-PageUp copy-mode -eu
bind -n M-PageUp copy-mode -eu
bind -T copy-mode    S-PageUp   send-keys -X page-up
bind -T copy-mode    S-PageDown send-keys -X page-down
bind -T copy-mode    M-PageUp   send-keys -X page-up
bind -T copy-mode    M-PageDown send-keys -X page-down
bind -T copy-mode-vi S-PageUp   send-keys -X page-up
bind -T copy-mode-vi S-PageDown send-keys -X page-down
bind -T copy-mode-vi M-PageUp   send-keys -X page-up
bind -T copy-mode-vi M-PageDown send-keys -X page-down

# --- no new-window affordance -------------------------------------------------------------------
# One `claude` per container (invariant 6): a second tmux window is an invitation to launch a second
# claude the spawn guard can't see, and the hidden window list would make it invisible. Splits stay —
# a shell pane next to claude is fine (it's the same as a second terminal window).
unbind c
