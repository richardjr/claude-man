[project]
name = "claude-man"
version = "0.1.0"
description = "A Textual TUI + CLI that provisions and manages hardened Docker containers, each running Claude Code under a chosen account profile, for a set of long-lived git-checkout projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Richard Reynolds", email = "xrouter@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=0.80",
    "tomlkit>=0.13",   # comment-preserving TOML writes; reads use stdlib tomllib
]

[project.urls]
Repository = "https://github.com/richardjr/claude-man"
Issues = "https://github.com/richardjr/claude-man/issues"
Documentation = "https://github.com/richardjr/claude-man/blob/main/docs/ARCHITECTURE.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
claudeman = "claudeman.__main__:main"        # launch the TUI
claudemanctl = "claudeman.cli:main"          # the scriptable CLI surface

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeman"]

# Bundle the runtime data trees the tool reads at run time — the Dockerfiles + image assets and the
# curated pack library — INTO the wheel under claudeman/_data/, so an installed copy works without
# the source checkout (config._data_root() finds them there). templates/ is docs-only, not bundled.
[tool.hatch.build.targets.wheel.force-include]
"images" = "claudeman/_data/images"
"library" = "claudeman/_data/library"

# The sdist ships the full source tree (incl. images/ + library/ + templates/ + tests) so it can
# rebuild the wheel from source.
[tool.hatch.build.targets.sdist]
include = ["/src", "/images", "/library", "/templates", "/tests", "/*.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 widened its DEFAULT selection (~400 rules) and CI runs
# `uvx ruff check` unpinned, so an unchanged tree went from green to ~200 findings overnight. This is
# the pre-0.16 default set the codebase was written against; widen deliberately, not by upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
