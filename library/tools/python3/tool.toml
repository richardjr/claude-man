# python3 + venv from Debian trixie (3.13). Project deps belong in a .venv under /workspace (the
# rootfs is read-only — `pip install --user` / system installs fail); pip's cache is already
# redirected to /workspace by the baked PIP_CACHE_DIR. Pair with `uv` for the uv-only workflow.
description = "Python 3 interpreter + venv (Debian)"
kind = "apt"
packages = ["python3", "python3-venv"]

[[smoke]]
name = "python3 --version"
argv = ["python3", "--version"]
expect = "Python 3"

# CORE op under the floor: create a venv on the writable /workspace bind (no network: --without-pip).
[[smoke]]
name = "python3 -m venv on /workspace (read-only floor)"
argv = ["sh", "-lc", "python3 -m venv --without-pip \"$(mktemp -d -p /workspace)/v\" && echo ok"]
expect = "ok"
timeout = 30
